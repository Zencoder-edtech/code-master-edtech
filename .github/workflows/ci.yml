name: CodeMaster CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Code Quality & Build Checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://mock_user:mock_pass@localhost:5432/mock_db"
      NEXTAUTH_SECRET: "mock_secret_for_ci_pipeline_verification"

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v6

      - name: Install Pnpm Package Manager
        uses: pnpm/action-setup@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Project Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint Linter Checks
        run: pnpm lint

      - name: Run TypeScript Type Checks
        run: pnpm check-types

      - name: Run Next.js Production Build
        run: pnpm build
        env:
          TURBO_CACHE_DIR: .turbo
